services:
  - type: web
    name: irctc-train-booking
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: FLASK_DEBUG
        value: "0"
