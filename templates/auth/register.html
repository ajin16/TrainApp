{% extends 'base.html' %}

{% block title %}User Registration - IRCTC{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-irctc-gradient text-white text-center py-4 rounded-top-4">
                    <i class="fa-solid fa-user-plus fa-2xl mb-2 text-warning"></i>
                    <h4 class="fw-bold mb-0">Create IRCTC Account</h4>
                    <p class="small text-white-50 mb-0">Register to book train tickets across India</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="e.g. rahul_sharma" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="rahul@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" name="full_name" class="form-control" placeholder="Rahul Sharma" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" name="phone" class="form-control" placeholder="10-digit mobile number">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Create password" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-irctc-orange w-100 py-2 rounded-3 shadow-sm mt-4">
                            <i class="fa-solid fa-check-circle me-2"></i> Register Account
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3 rounded-bottom-4">
                    <span class="small text-muted">Already registered? </span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-bold text-decoration-none">Sign In Here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
