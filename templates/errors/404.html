{% extends "base.html" %}

{% block title %}404 - Page Not Found | IRCTC NextGen{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6 text-center">
            <div class="card shadow-sm border-0 rounded-3 p-4">
                <div class="mb-3">
                    <span class="badge bg-danger-subtle text-danger px-3 py-2 rounded-pill fs-6 fw-bold">
                        <i class="fa-solid fa-triangle-exclamation me-1"></i> Error Code 404
                    </span>
                </div>
                <div class="display-1 fw-bold text-secondary mb-2">
                    <i class="fa-solid fa-train text-danger opacity-75"></i>
                </div>
                <h3 class="fw-bold text-dark">Station / Route Not Found</h3>
                <p class="text-muted mb-4">
                    The requested track or page does not exist or may have been relocated in the reservation network.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('user.index') }}" class="btn btn-primary px-4 py-2">
                        <i class="fa-solid fa-house me-1"></i> Return to Home
                    </a>
                    <a href="{{ url_for('user.pnr_status') }}" class="btn btn-outline-secondary px-3 py-2">
                        <i class="fa-solid fa-ticket me-1"></i> Check PNR
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
